name: Log Contribution to GitChain

# Fires on every push to any branch.
# Skips cleanly unless GITCHAIN_PRIVATE_KEY and GITCHAIN_NODE_URL secrets are set.
on: [push]

jobs:
  log-contribution:
    runs-on: ubuntu-latest
    env:
      GITCHAIN_PRIVATE_KEY: ${{ secrets.GITCHAIN_PRIVATE_KEY }}
      GITCHAIN_NODE_URL:    ${{ secrets.GITCHAIN_NODE_URL }}
    steps:
      - name: Check GitChain is configured
        id: cfg
        run: |
          if [ -n "$GITCHAIN_PRIVATE_KEY" ] && [ -n "$GITCHAIN_NODE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "GitChain secrets not set; skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          fetch-depth: 2

      - name: Set up Node.js
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GitChain dependencies
        if: steps.cfg.outputs.enabled == 'true'
        run: npm install tweetnacl
        working-directory: gitchain/github-action

      - name: Log commit to GitChain
        if: steps.cfg.outputs.enabled == 'true'
        run: node gitchain-submit.js
        working-directory: gitchain/github-action
